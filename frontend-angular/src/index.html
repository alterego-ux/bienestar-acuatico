<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bienestar Acuático — Aquatic Performance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071923">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Plataforma académica para apoyar la evaluación del bienestar de peces de cultivo con indicadores, evidencias e historial por predio. Basada en la metodología ICA v2.0.">
  <link rel="icon" href="Im/Logo.jpg">
  <script>
    /* Aplica el tema guardado antes de pintar (evita el parpadeo claro/oscuro). */
    (function () { try { var t = localStorage.getItem('bienestar_tema');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
