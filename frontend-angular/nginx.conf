server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Todas las peticiones de la API se envían al contenedor backend.
    location /api/ {
        proxy_pass http://backend:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /api {
        proxy_pass http://backend:4100/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular usa rutas del lado del cliente; devuelve index.html al navegar directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
